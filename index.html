<!DOCTYPE html>

<html>
<head>
<title>Dear Diary 💖</title>

<style>

body{
    text-align:center;
    font-family:"Comic Sans MS", cursive;
    background:#ffc0cb;
}

.dark{
    background:#2b2b2b;
    color:white;
}

h1{
    color:#ff1493;
}

#container{
    width:450px;
    margin:auto;
    background:#ffe4ec;
    border:4px solid #ff69b4;
    border-radius:25px;
    padding:20px;
    box-shadow:0 0 20px #ffb6c1;
}

.dark #container{
    background:#3a3a3a;
}

textarea{
    width:90%;
    height:120px;
    border-radius:10px;
    border:2px solid #ff69b4;
    padding:10px;
}

button{
    margin:5px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#ff69b4;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#ff1493;
}

.entry{
    background:white;
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    text-align:left;
}

.dark .entry{
    background:#555;
}

.stickers{
    font-size:22px;
    cursor:pointer;
}

#auth{
    margin-top:40px;
}

input{
    padding:8px;
    margin:5px;
    border-radius:8px;
    border:2px solid #ff69b4;
}

</style>

</head>

<body>

<div id="auth">

<h1>📔 Dear Diary 💖</h1>

<input id="name" placeholder="Your name">
<br>

<input id="pass" type="password" placeholder="Password">
<br>

<button onclick="signup()">Sign Up 🌸</button> <button onclick="login()">Sign In 💖</button>

</div>

<div id="app" style="display:none">

<h1>📔 Dear Diary 💖</h1>

<div id="container">

<textarea id="diaryText" placeholder="Write your thoughts..."></textarea>

<div class="stickers">
<span onclick="addEmoji('💕')">💕</span>
<span onclick="addEmoji('🌸')">🌸</span>
<span onclick="addEmoji('🎀')">🎀</span>
<span onclick="addEmoji('✨')">✨</span>
<span onclick="addEmoji('🌷')">🌷</span>
</div>

<br>

<button onclick="saveEntry()">Save Entry 💕</button> <button onclick="toggleDark()">🌙 Night Mode</button>

<div id="entries"></div>

</div>

</div>

<script>

let currentUser = null;

function signup(){

let name=document.getElementById("name").value;
let pass=document.getElementById("pass").value;

if(name===""||pass===""){
alert("Enter name and password");
return;
}

let user={
name:name,
pass:pass
};

localStorage.setItem("user_"+name,JSON.stringify(user));
alert("Account created! Now sign in.");

}

function login(){

let name=document.getElementById("name").value;
let pass=document.getElementById("pass").value;

let user=JSON.parse(localStorage.getItem("user_"+name));

if(user && user.pass===pass){

currentUser=name;

document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";

loadEntries();

}else{
alert("Wrong name or password");
}

}

function addEmoji(e){
document.getElementById("diaryText").value+=e;
}

function saveEntry(){

let text=document.getElementById("diaryText").value;

if(text==="") return;

let date=new Date().toLocaleString();

let entry={
text:text,
date:date
};

let saved=JSON.parse(localStorage.getItem("diary_"+currentUser))||[];

saved.unshift(entry);

localStorage.setItem("diary_"+currentUser,JSON.stringify(saved));

document.getElementById("diaryText").value="";

loadEntries();

}

function loadEntries(){

let container=document.getElementById("entries");

container.innerHTML="";

let saved=JSON.parse(localStorage.getItem("diary_"+currentUser))||[];

saved.forEach(e=>{

let div=document.createElement("div");

div.className="entry";

div.innerHTML="<b>"+e.date+"</b><br>"+e.text;

container.appendChild(div);

});

}

function toggleDark(){
document.body.classList.toggle("dark");
}

</script>

</body>
</html>
